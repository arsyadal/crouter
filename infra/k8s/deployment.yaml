apiVersion: apps/v1
kind: Deployment
metadata:
  name: crouter-gateway
  labels:
    app: crouter-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: crouter-gateway
  template:
    metadata:
      labels:
        app: crouter-gateway
    spec:
      containers:
        - name: gateway
          image: crouter/gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: GATEWAY_HOST
              value: "0.0.0.0"
            - name: GATEWAY_PORT
              value: "8000"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: crouter-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: crouter-secrets
                  key: redis-url
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
