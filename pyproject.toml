[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crouter"
version = "0.1.0"
description = "CRouter: Multi-Provider AI Inference Gateway - One Gateway. Every Model."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Muhammad Arsyad", email = "arsyadal@example.com" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "httpx>=0.27.0",
    "sqlalchemy>=2.0.35",
    "alembic>=1.13.0",
    "redis>=5.1.0",
    "click>=8.1.0",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.29.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
]

[project.scripts]
crouter = "apps.gateway.cli:cli"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.hatch.build.targets.wheel]
packages = ["apps", "packages"]
